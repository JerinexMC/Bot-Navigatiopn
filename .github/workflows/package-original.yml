name: Package original JAR (source recovery starter)

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve uploaded original JAR
        run: |
          mkdir -p build/libs
          cp libs/JerinexBotNavigation-1.0.0-original.jar build/libs/
      - name: Upload original JAR
        uses: actions/upload-artifact@v4
        with:
          name: JerinexBotNavigation-1.0.0-original
          path: build/libs/JerinexBotNavigation-1.0.0-original.jar
